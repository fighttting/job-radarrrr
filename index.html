<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>job-raderrrr</title>
    <style>
      :root {
        color: #171717;
        background: #f6f4ef;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
      }

      main {
        width: min(760px, calc(100vw - 32px));
        margin: 48px auto;
      }

      h1 {
        margin: 0 0 24px;
        font-size: clamp(2rem, 5vw, 3rem);
        line-height: 1;
      }

      h2 {
        margin: 0 0 6px;
        font-size: 1.25rem;
      }

      p {
        margin: 0 0 12px;
      }

      small {
        display: inline-flex;
        border: 1px solid #c9c2b5;
        border-radius: 999px;
        padding: 4px 10px;
        color: #4f4638;
        background: #fffaf0;
      }

      #root > div > div {
        border: 1px solid #d8d2c8;
        border-radius: 8px;
        padding: 18px;
        background: #fffdf8;
      }
    </style>
  </head>
  <body>
    <main id="root"></main>

    <script
      crossorigin
      src="https://unpkg.com/react@18/umd/react.development.js"
    ></script>
    <script
      crossorigin
      src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"
    ></script>
    <script src="./src/App.js"></script>
  </body>
</html>
